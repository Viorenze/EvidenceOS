[project]
name = "evidenceos"
version = "0.1.0"
description = "Verifiable AI knowledge base with hybrid retrieval, conditional LangGraph agent, and CLI eval"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2.1",
    "pgvector>=0.3.2",
    "python-multipart>=0.0.9",
    "jieba>=0.42.1",
    "pypdf>=4.3.0",
    "sentence-transformers>=3.0.1",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
