services:
  db:
    image: pgvector/pgvector:pg16
    container_name: evidenceos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evidence
      POSTGRES_PASSWORD: evidence
      POSTGRES_DB: evidenceos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evidence -d evidenceos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
